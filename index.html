<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目链接</title>
<style>
  :root {
    --bg: #0b1020;
    --card: rgba(255, 255, 255, 0.045);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --primary: #818cf8;
    --primary-2: #c084fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(129, 140, 248, 0.18), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(192, 132, 252, 0.14), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 56px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .page { width: 100%; max-width: 860px; }

  /* ---------- 头部 ---------- */
  header { margin-bottom: 28px; }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 10%, var(--primary) 60%, var(--primary-2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
  }

  /* ---------- 搜索框 ---------- */
  .toolbar { margin-bottom: 16px; }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    width: 16px;
    height: 16px;
    color: var(--muted);
    pointer-events: none;
  }

  #search {
    width: 100%;
    padding: 12px 16px 12px 40px;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }

  #search::placeholder { color: #64748b; }

  #search:focus {
    border-color: rgba(129, 140, 248, 0.55);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.12);
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.65);
  }

  /* ---------- 表格 ---------- */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14.5px;
  }

  thead th {
    text-align: left;
    padding: 16px 22px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border);
  }

  thead th:last-child { width: 42%; }

  tbody tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background .18s ease;
    animation: fadeUp .45s ease both;
  }

  tbody tr:last-child { border-bottom: none; }

  tbody tr:hover { background: rgba(255, 255, 255, 0.045); }

  tbody td { padding: 15px 22px; vertical-align: middle; }

  /* 项目单元格 */
  .project {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-weight: 700;
    color: #0b1020;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 4px 12px -2px rgba(129, 140, 248, 0.45);
  }

  .name { font-weight: 500; }

  /* 连接单元格 */
  .link {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    text-decoration: none;
    color: #cbd5e1;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 13.5px;
    transition: all .18s ease;
  }

  .link:hover {
    color: #fff;
    background: rgba(129, 140, 248, 0.16);
    border-color: rgba(129, 140, 248, 0.5);
    transform: translateY(-1px);
  }

  .link .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
    flex: 0 0 auto;
  }

  .link .host {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }

  .link svg {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
    opacity: 0.6;
    transition: transform .18s ease, opacity .18s ease;
  }

  .link:hover svg { opacity: 1; transform: translate(2px, -2px); }

  /* 空状态 */
  .empty {
    padding: 56px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 620px) {
    body { padding: 32px 14px 60px; }
    h1 { font-size: 24px; }
    thead th:last-child { width: 46%; }
    thead th, tbody td { padding: 13px 14px; }
    .link { padding: 5px 10px 5px 9px; font-size: 13px; }
    .link .host { max-width: 130px; }
    .avatar { width: 28px; height: 28px; border-radius: 9px; font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>项目链接</h1>
      <p>常用项目与相关连接，点击即可跳转</p>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="search" type="text" placeholder="搜索项目或连接…" autocomplete="off">
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>项目</th>
            <th>连接</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>没有找到匹配的项目</div>
    </div>
  </div>

<script>
  // ====== 在这里维护你的数据 ======
  const projects = [
    { name: 'PARA 管理',  url: './para' },
    { name: 'GitHub 仓库',  url: 'https://github.com' },
    { name: 'Expo 文档',    url: 'https://docs.expo.dev' },
    { name: '设计稿',       url: 'https://www.figma.com' },
    { name: '任务看板',     url: 'https://linear.app' },
    { name: '部署控制台',   url: 'https://vercel.com/dashboard' },
    { name: '监控面板',     url: 'https://grafana.com' },
  ];

  const tbody = document.getElementById('tbody');
  const emptyEl = document.getElementById('empty');

  const ARROW_SVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 17 17 7"></path>
      <path d="M8 7h9v9"></path>
    </svg>`;

  function hostOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch {
      return url;
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function render(list) {
    if (!list.length) {
      tbody.innerHTML = '';
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    tbody.innerHTML = list.map((p, i) => `
      <tr style="animation-delay:${Math.min(i * 45, 400)}ms">
        <td>
          <div class="project">
            <span class="avatar">${escapeHtml(p.name.trim().charAt(0).toUpperCase())}</span>
            <span class="name">${escapeHtml(p.name)}</span>
          </div>
        </td>
        <td>
          <a class="link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">
            <span class="dot"></span>
            <span class="host">${escapeHtml(hostOf(p.url))}</span>
            ${ARROW_SVG}
          </a>
        </td>
      </tr>
    `).join('');
  }

  // 搜索过滤
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    const filtered = !q ? projects : projects.filter(p =>
      p.name.toLowerCase().includes(q) || p.url.toLowerCase().includes(q)
    );
    render(filtered);
  });

  // 首次渲染
  render(projects);
</script>
</body>
</html>
